services:
  postgres-test:
    image: postgres:17
    container_name: retailflow-postgres-test
    environment:
      POSTGRES_USER: retailflow_test
      POSTGRES_PASSWORD: retailflow_test_local_only
      POSTGRES_DB: retailflow_integration_test
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U retailflow_test -d retailflow_integration_test
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data
