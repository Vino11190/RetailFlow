
name: RetailFlow CI

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  python-validation:
    name: Python Syntax and Structure
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check Python syntax
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          excluded = {
              ".git",
              ".venv",
              "venv",
              "__pycache__",
              "dbt_packages",
              "target",
              "logs",
          }

          files = [
              path
              for path in Path(".").rglob("*.py")
              if not any(
                  part in excluded
                  for part in path.parts
              )
          ]

          for path in files:
              ast.parse(
                  path.read_text(encoding="utf-8-sig"),
                  filename=str(path),
              )

          print(
              f"PASS: {len(files)} Python files "
              "passed syntax validation."
          )
          PY

      - name: Check repository structure
        shell: bash
        run: |
          test -f README.md
          test -d docs
          test -d airflow
          test -d tests
          test -f requirements.txt

          echo "PASS: Required RetailFlow files exist."

  python-tests:
    name: Python Unit Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pandas

      - name: Run automated unit tests
        shell: bash
        run: |
          python -m pytest tests/test_data_quality.py -v

  
  dbt-validation:
    name: dbt Project Validation
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: dbt/retailflow_analytics

    env:
      DBT_POSTGRES_HOST: localhost
      DBT_POSTGRES_PORT: "5433"
      DBT_POSTGRES_USER: ci_validation
      DBT_POSTGRES_PASSWORD: ci_placeholder_not_a_real_password
      DBT_POSTGRES_DB: retailflow_warehouse

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dbt PostgreSQL adapter
        run: |
          python -m pip install --upgrade pip
          python -m pip install "dbt-postgres==1.9.0"

      - name: Verify dbt version
        run: |
          dbt --version

      - name: Validate dbt project
        run: |
          dbt parse \
            --project-dir . \
            --profiles-dir . \
            --no-partial-parse

  
  airflow-validation:
    name: Airflow DAG Static Validation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate RetailFlow DAG
        run: |
          python scripts/validate_airflow_dag.py
  
  security-scan:
    name: Secret Detection
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        shell: bash
        run: |
          GITLEAKS_VERSION="8.24.3"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz

          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan tracked project content
        shell: bash
        run: |
          gitleaks dir . \
            --no-banner \
            --redact \
            --exit-code 1

  postgres-integration:
    name: PostgreSQL Integration Tests
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: retailflow_test
          POSTGRES_PASSWORD: retailflow_test_local_only
          POSTGRES_DB: retailflow_integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retailflow_test -d retailflow_integration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      GITHUB_ACTIONS: "true"
      RETAILFLOW_TEST_DB_HOST: "127.0.0.1"
      RETAILFLOW_TEST_DB_PORT: "5432"
      RETAILFLOW_TEST_DB_NAME: "retailflow_integration_test"
      RETAILFLOW_TEST_DB_USER: "retailflow_test"
      RETAILFLOW_TEST_DB_PASSWORD: "retailflow_test_local_only"
      PGPASSWORD: "retailflow_test_local_only"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install integration test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pytest==9.1.1" \
            "psycopg2-binary==2.9.13" \
            "pandas>=2.2,<3" \
            "SQLAlchemy>=2.0,<3"
      - name: Initialise warehouse schemas
        shell: bash
        run: |
          set -euo pipefail

          for ddl in \
            warehouse/ddl/01_create_schemas.sql \
            warehouse/ddl/03_create_foundation_tables.sql \
            warehouse/ddl/04_create_gold_tables.sql \
            warehouse/ddl/05_create_silver_tables.sql
          do
            echo "Applying $ddl"

            psql \
              -h 127.0.0.1 \
              -p 5432 \
              -U retailflow_test \
              -d retailflow_integration_test \
              -X -v ON_ERROR_STOP=1 \
              -1 -f "$ddl"
          done

      - name: Run PostgreSQL integration tests
        run: |
          python -m pytest tests/integration -v
