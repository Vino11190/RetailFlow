
name: RetailFlow CI

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  python-validation:
    name: Python Syntax and Structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          excluded = {
              ".git",
              ".venv",
              "venv",
              "__pycache__",
              "dbt_packages",
              "target",
              "logs",
          }

          files = [
              path
              for path in Path(".").rglob("*.py")
              if not any(
                  part in excluded
                  for part in path.parts
              )
          ]

          for path in files:
              ast.parse(
                  path.read_text(encoding="utf-8-sig"),
                  filename=str(path),
              )

          print(
              f"PASS: {len(files)} Python files "
              "passed syntax validation."
          )
          PY

      - name: Check repository structure
        shell: bash
        run: |
          test -f README.md
          test -d docs
          test -d airflow
          test -d tests
          test -f requirements.txt

          echo "PASS: Required RetailFlow files exist."

  python-tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pandas

      - name: Run automated unit tests
        shell: bash
        run: |
          python -m pytest tests/test_data_quality.py -v

  
  dbt-validation:
    name: dbt Project Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dbt/retailflow_analytics

    env:
      DBT_POSTGRES_HOST: localhost
      DBT_POSTGRES_PORT: "5433"
      DBT_POSTGRES_USER: ci_validation
      DBT_POSTGRES_PASSWORD: ci_placeholder_not_a_real_password
      DBT_POSTGRES_DB: retailflow_warehouse

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt PostgreSQL adapter
        run: |
          python -m pip install --upgrade pip
          python -m pip install "dbt-postgres==1.9.0"

      - name: Verify dbt version
        run: |
          dbt --version

      - name: Validate dbt project
        run: |
          dbt parse \
            --project-dir . \
            --profiles-dir . \
            --no-partial-parse

  
  airflow-validation:
    name: Airflow DAG Static Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate RetailFlow DAG
        run: |
          python scripts/validate_airflow_dag.py
  
  security-scan:
    name: Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        shell: bash
        run: |
          GITLEAKS_VERSION="8.24.3"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz

          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan tracked project content
        shell: bash
        run: |
          gitleaks dir . \
            --no-banner \
            --redact \
            --exit-code 1
