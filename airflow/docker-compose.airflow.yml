
name: retailflow-airflow

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  image: ${AIRFLOW_IMAGE_NAME:-retailflow-airflow:local}
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_local_only@airflow-postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"

    POSTGRES_HOST: host.docker.internal
    POSTGRES_PORT: "5432"
    POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}

    WAREHOUSE_POSTGRES_HOST: host.docker.internal
    WAREHOUSE_POSTGRES_PORT: "5433"
    WAREHOUSE_POSTGRES_USER: ${WAREHOUSE_POSTGRES_USER:?Set WAREHOUSE_POSTGRES_USER}
    WAREHOUSE_POSTGRES_PASSWORD: ${WAREHOUSE_POSTGRES_PASSWORD:?Set WAREHOUSE_POSTGRES_PASSWORD}
    WAREHOUSE_POSTGRES_DB: ${WAREHOUSE_POSTGRES_DB:?Set WAREHOUSE_POSTGRES_DB}

    DBT_POSTGRES_HOST: host.docker.internal
    DBT_POSTGRES_PORT: "5433"
    DBT_POSTGRES_USER: ${WAREHOUSE_POSTGRES_USER:?Set WAREHOUSE_POSTGRES_USER}
    DBT_POSTGRES_PASSWORD: ${WAREHOUSE_POSTGRES_PASSWORD:?Set WAREHOUSE_POSTGRES_PASSWORD}
    DBT_POSTGRES_DB: ${WAREHOUSE_POSTGRES_DB:?Set WAREHOUSE_POSTGRES_DB}

    PRODUCT_API_BASE_URL: "http://host.docker.internal:8000"
    PYTHONPATH: /opt/retailflow

  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config
    - ../:/opt/retailflow

  user: "${AIRFLOW_UID:-50000}:0"

  depends_on:
    airflow-postgres:
      condition: service_healthy

  restart: unless-stopped

services:
  airflow-postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow_local_only
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U airflow -d airflow
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    restart: "no"
    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username "$${AIRFLOW_ADMIN_USERNAME}" \
          --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname RetailFlow \
          --lastname Admin \
          --role Admin \
          --email admin@retailflow.local
    environment:
      <<: *airflow-common-env
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD in airflow/.env}

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://localhost:8080/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

volumes:
  airflow_postgres_data:
